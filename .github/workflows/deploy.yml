# CI/CD geo_server: проверка → сборка Docker-образа в ghcr.io → запуск контейнера на сервере.
#
# Секреты репозитория: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# Секреты приложения лежат на сервере в /opt/geoeco/.env (шаблон — .env.example), в образ не попадают.
# На сервере docker уже залогинен в ghcr.io (используется и другими контейнерами),
# поэтому здесь логин не выполняется, чтобы не перезаписать постоянные учётные данные.
name: CI/CD geo_server

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-geo-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: demidovsi/geoeco
  CONTAINER: geoeco
  ENV_FILE: /opt/geoeco/.env

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes

      - name: Pyflakes (только ошибки)
        run: |
          python -m pyflakes main_geo_server.py common.py trafaret_thread.py t_*.py > pyflakes.log || true
          cat pyflakes.log
          ! grep -E "undefined name|syntax error|invalid syntax" pyflakes.log

      - name: Import check
        env:
          ENCODED_PASSWORD: ci-dummy
        run: python -c "import main_geo_server"

  build-and-push:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            NAME=${{ env.CONTAINER }}
            ENV_FILE=${{ env.ENV_FILE }}
            [ -f "$ENV_FILE" ] || { echo "ERROR: нет $ENV_FILE с секретами"; exit 1; }

            # Pull нового образа — при ошибке работающий контейнер не трогаем
            docker pull "$IMAGE" || { echo "ERROR: docker pull failed, keeping current container"; exit 1; }

            OLD_IMAGE=$(docker inspect --format='{{.Image}}' "$NAME" 2>/dev/null || echo "")

            run_container() {
              docker run -d \
                --name "$NAME" \
                --restart unless-stopped \
                --network host \
                --stop-timeout 30 \
                --env-file "$ENV_FILE" \
                --log-opt max-size=50m --log-opt max-file=3 \
                "$1"
            }

            docker stop "$NAME" 2>/dev/null || true
            docker rm "$NAME" 2>/dev/null || true
            run_container "$IMAGE"

            sleep 15
            if [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$NAME")" != "true 0" ]; then
              echo "ERROR: new container failed to start"
              docker logs --tail 100 "$NAME" || true
              docker rm -f "$NAME" || true
              if [ -n "$OLD_IMAGE" ]; then
                echo "Rolling back to $OLD_IMAGE"
                run_container "$OLD_IMAGE"
              fi
              exit 1
            fi

            docker logs --tail 20 "$NAME"
            docker image prune -f
